<svg xmlns="http://www.w3.org/2000/svg" width="560" height="492" viewBox="0 0 560 492" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">Instructions are prompt text; guardrails are code</title>
<desc id="desc">Instructions are prompt text the model reads, such as be plain and specific, name who decides, never promise a reply; a model can get them wrong. Guardrails are code and manifest data, such as a payment waits for a person, an order over the limit is saved as a draft, a move to hired is refused; they are checked before any call and hold whatever the model writes. When the model asks for a tool call, the role's own code checks the guardrail before your system is called, so a backend that accepts anything still cannot get round them.</desc>
<rect x="0.5" y="0.5" width="559" height="491" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="24" y="38" font-size="20" font-weight="600" fill="#1f2328">Instructions and guardrails</text><rect x="16" y="58" width="256" height="236" rx="10" fill="#0969da" fill-opacity="0.08" stroke="#0969da" stroke-opacity="0.55"/><rect x="16" y="58" width="256" height="6" rx="3" fill="#0969da"/><text x="30" y="90" font-size="16" font-weight="600" fill="#1f2328">Instructions</text><text x="30" y="110" font-size="13" font-weight="400" fill="#59636e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">prompt text</text><text x="30" y="142" font-size="14" font-weight="400" fill="#1f2328">• Plain, warm, specific.</text><text x="30" y="175" font-size="14" font-weight="400" fill="#1f2328">• Name who decides, and how</text><text x="42" y="194" font-size="14" font-weight="400" fill="#1f2328">to reach them.</text><text x="30" y="227" font-size="14" font-weight="400" fill="#1f2328">• Never promise a reply.</text><text x="30" y="260" font-size="13.5" font-weight="600" fill="#0969da">The model reads these.</text><text x="30" y="279" font-size="13.5" font-weight="600" fill="#0969da">A model can get them wrong.</text><rect x="288" y="58" width="256" height="236" rx="10" fill="#cf222e" fill-opacity="0.08" stroke="#cf222e" stroke-opacity="0.55"/><rect x="288" y="58" width="256" height="6" rx="3" fill="#cf222e"/><text x="302" y="90" font-size="16" font-weight="600" fill="#1f2328">Guardrails</text><text x="302" y="110" font-size="13" font-weight="400" fill="#59636e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">code and manifest data</text><text x="302" y="142" font-size="14" font-weight="400" fill="#1f2328">• A payment waits for a person.</text><text x="302" y="175" font-size="14" font-weight="400" fill="#1f2328">• An order over the limit is</text><text x="314" y="194" font-size="14" font-weight="400" fill="#1f2328">saved as a draft.</text><text x="302" y="227" font-size="14" font-weight="400" fill="#1f2328">• A move to hired is refused.</text><text x="302" y="260" font-size="13.5" font-weight="600" fill="#cf222e">Checked before any call.</text><text x="302" y="279" font-size="13.5" font-weight="600" fill="#cf222e">They hold whatever it writes.</text><text x="24" y="322" font-size="16" font-weight="600" fill="#1f2328">Whatever system is connected</text><rect x="16" y="338" width="138" height="62" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="85" y="365" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">The model</text><text x="85" y="385" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">asks for a tool call</text><rect x="211" y="338" width="138" height="62" rx="10" fill="#cf222e" fill-opacity="0.12" stroke="#cf222e" stroke-opacity="1"/><text x="280" y="365" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">The role's code</text><text x="280" y="385" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">checks the guardrail</text><rect x="406" y="338" width="138" height="62" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="475" y="365" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Your system</text><text x="475" y="385" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">any backend</text><line x1="158" y1="369" x2="207" y2="369" stroke="#59636e" stroke-width="1.75"/><polygon points="207,369 200.69687028353127,372.0447587387786 200.69687028353127,365.9552412612214" fill="#59636e"/><line x1="353" y1="375" x2="402" y2="375" stroke="#1a7f37" stroke-width="1.75"/><polygon points="402,375 395.69687028353127,378.0447587387786 395.69687028353127,371.9552412612214" fill="#1a7f37"/><text x="377.5" y="365" font-size="12.5" font-weight="400" fill="#1a7f37" text-anchor="middle">allowed</text><line x1="280" y1="404" x2="280" y2="426" stroke="#cf222e" stroke-width="1.75"/><polygon points="280,426 276.9552412612214,419.69687028353127 283.0447587387786,419.69687028353127" fill="#cf222e"/><text x="290" y="422" font-size="12.5" font-weight="400" fill="#cf222e">refused, or held for a person</text><rect x="16" y="430" width="528" height="46" rx="10" fill="none" stroke="#d1d9e0" stroke-width="1" stroke-dasharray="5 4"/><text x="280" y="450" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="middle">A backend that accepts anything still cannot get round them:</text><text x="280" y="468" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="middle">the role checks first.</text>
</svg>
