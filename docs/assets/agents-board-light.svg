<svg xmlns="http://www.w3.org/2000/svg" width="600" height="530" viewBox="0 0 600 530" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">The fifteen Office Hum agents by department</title>
<desc id="desc">Customers: Front Desk, Sales, Support, Marketing. Operations: Operations, Purchasing, Inventory, Quality, Safety. Finance: Bookkeeper, Payroll, Finance Analyst. People and IT: People Ops, IT Help Desk. Coordination: Office Manager. Each is an npm package with instructions, skills, tools, guardrails and an eval suite, and runs on its own Pi Durable harness.</desc>
