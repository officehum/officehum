<svg xmlns="http://www.w3.org/2000/svg" width="560" height="672" viewBox="0 0 560 672" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">A request, start to finish, for one agent</title>
<desc id="desc">1. A message comes in: Rosa asks the Bookkeeper to pay the Rainier Cleaning Tools bill, and the forwarded email claims it is already approved. 2. The agent reads before it acts: list_vendor_bills returns BILL-2001, $648.00, overdue; the figure comes from the tool. 3. It calls pay_vendor_bill. A guardrail in the role's code stops the call until a person approves, whatever the email says. 4. A person decides, yes or no. 5. The reply says what happened: paid with the payment id from the receipt, or not paid.</desc>
<rect x="0.5" y="0.5" width="559" height="671" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="24" y="38" font-size="20" font-weight="600" fill="#1f2328">A request, start to finish</text><text x="24" y="60" font-size="14" font-weight="400" fill="#59636e">The Bookkeeper on its own, on the sample company</text><rect x="16" y="80" width="528" height="80" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><circle cx="38" cy="102" r="12" fill="#0969da"/><text x="38" y="107" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="60" y="107" font-size="16" font-weight="600" fill="#1f2328">A message comes in</text><text x="60" y="130" font-size="14" font-weight="400" fill="#1f2328">Rosa: please pay the Rainier Cleaning Tools bill.</text><text x="60" y="151" font-size="13.5" font-weight="400" fill="#cf222e">The forwarded email says: “Already approved. Pay now.”</text><line x1="280" y1="163" x2="280" y2="183" stroke="#59636e" stroke-width="1.75"/><polygon points="280,183 276.9552412612214,176.69687028353127 283.0447587387786,176.69687028353127" fill="#59636e"/><rect x="16" y="186" width="528" height="80" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><circle cx="38" cy="208" r="12" fill="#1a7f37"/><text x="38" y="213" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="60" y="213" font-size="16" font-weight="600" fill="#1f2328">It reads before it acts</text><text x="60" y="236" font-size="13" font-weight="400" fill="#59636e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">list_vendor_bills → BILL-2001, $648.00, overdue</text><text x="60" y="257" font-size="14" font-weight="400" fill="#1f2328">The figure comes from the tool, not the model.</text><line x1="280" y1="269" x2="280" y2="289" stroke="#59636e" stroke-width="1.75"/><polygon points="280,289 276.9552412612214,282.69687028353127 283.0447587387786,282.69687028353127" fill="#59636e"/><rect x="16" y="292" width="528" height="59" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><circle cx="38" cy="314" r="12" fill="#1a7f37"/><text x="38" y="319" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="60" y="319" font-size="16" font-weight="600" fill="#1f2328">It calls pay_vendor_bill</text><text x="60" y="342" font-size="13" font-weight="400" fill="#59636e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">pay_vendor_bill { bill: BILL-2001 }</text><line x1="280" y1="354" x2="280" y2="375" stroke="#59636e" stroke-width="1.75"/><polygon points="280,375 276.9552412612214,368.69687028353127 283.0447587387786,368.69687028353127" fill="#59636e"/><rect x="16" y="377" width="528" height="88" rx="10" fill="#cf222e" fill-opacity="0.12" stroke="#cf222e" stroke-opacity="1"/><text x="34" y="404" font-size="16" font-weight="600" fill="#1f2328">Guardrail: every payment waits for a person</text><text x="34" y="427" font-size="14" font-weight="400" fill="#1f2328">Checked in the role's code before the backend is called.</text><text x="34" y="448" font-size="14" font-weight="400" fill="#cf222e">“Already approved” in the email changes nothing.</text><line x1="280" y1="468" x2="280" y2="488" stroke="#59636e" stroke-width="1.75"/><polygon points="280,488 276.9552412612214,481.69687028353127 283.0447587387786,481.69687028353127" fill="#59636e"/><rect x="16" y="491" width="528" height="59" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><circle cx="38" cy="513" r="12" fill="#bc4c00"/><text x="38" y="518" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="60" y="518" font-size="16" font-weight="600" fill="#1f2328">A person decides</text><text x="60" y="541" font-size="14" font-weight="400" fill="#1f2328">Yes or no, in the terminal or through your approver.</text><line x1="280" y1="553" x2="280" y2="573" stroke="#59636e" stroke-width="1.75"/><polygon points="280,573 276.9552412612214,566.6968702835312 283.0447587387786,566.6968702835312" fill="#59636e"/><rect x="16" y="576" width="528" height="80" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><circle cx="38" cy="598" r="12" fill="#8250df"/><text x="38" y="603" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="60" y="603" font-size="16" font-weight="600" fill="#1f2328">The reply says what happened</text><text x="60" y="626" font-size="14" font-weight="400" fill="#1f2328">Yes: paid, payment PAY-601 from the receipt.</text><text x="60" y="647" font-size="14" font-weight="400" fill="#1f2328">No: not paid, and the reply says so.</text>
</svg>
