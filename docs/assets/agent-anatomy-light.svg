<svg xmlns="http://www.w3.org/2000/svg" width="560" height="596" viewBox="0 0 560 596" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="title">Anatomy of an agent</title>
<desc id="desc">One npm package holds the agent's instructions (AGENTS.md and APPEND_SYSTEM.md, prompt text), its skills (skills/&lt;name&gt;/SKILL.md, prompt text), its tools (src/index.ts, code), its guardrails (officehum.json and tool code: approvals, limits and refusals checked in code) and its eval suite (evals/*.json). It runs on a Pi Durable harness, with any model: hosted by default, or one on your own machine.</desc>
<rect x="0.5" y="0.5" width="559" height="595" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="24" y="38" font-size="20" font-weight="600" fill="#1f2328">Anatomy of an agent</text><rect x="16" y="58" width="528" height="400" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><text x="32" y="86" font-size="15" font-weight="600" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">@officehum/&lt;role&gt;</text><text x="528" y="86" font-size="14" font-weight="400" fill="#59636e" text-anchor="end">one npm package</text><rect x="28" y="102" width="504" height="62" rx="8" fill="#0969da" fill-opacity="0.08" stroke="#0969da" stroke-opacity="0.55"/><rect x="28" y="102" width="5" height="62" rx="2.5" fill="#0969da"/><text x="46" y="127" font-size="16" font-weight="600" fill="#1f2328">Instructions</text><text x="160" y="127" font-size="13" font-weight="400" fill="#59636e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">AGENTS.md · APPEND_SYSTEM.md</text><text x="46" y="150" font-size="14" font-weight="400" fill="#1f2328">Who it is, what it does, its house style</text><rect x="420.6" y="136" width="99.4" height="22" rx="11" fill="none" stroke="#0969da" stroke-width="1"/><text x="470.3" y="151" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="middle">prompt text</text><rect x="28" y="172" width="504" height="62" rx="8" fill="#0969da" fill-opacity="0.08" stroke="#0969da" stroke-opacity="0.55"/><rect x="28" y="172" width="5" height="62" rx="2.5" fill="#0969da"/><text x="46" y="197" font-size="16" font-weight="600" fill="#1f2328">Skills</text><text x="160" y="197" font-size="13" font-weight="400" fill="#59636e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">skills/&lt;name&gt;/SKILL.md</text><text x="46" y="220" font-size="14" font-weight="400" fill="#1f2328">How to do one job, read when it is needed</text><rect x="420.6" y="206" width="99.4" height="22" rx="11" fill="none" stroke="#0969da" stroke-width="1"/><text x="470.3" y="221" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="middle">prompt text</text><rect x="28" y="242" width="504" height="62" rx="8" fill="#1a7f37" fill-opacity="0.08" stroke="#1a7f37" stroke-opacity="0.55"/><rect x="28" y="242" width="5" height="62" rx="2.5" fill="#1a7f37"/><text x="46" y="267" font-size="16" font-weight="600" fill="#1f2328">Tools</text><text x="160" y="267" font-size="13" font-weight="400" fill="#59636e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">src/index.ts</text><text x="46" y="290" font-size="14" font-weight="400" fill="#1f2328">The only way it acts on anything</text><rect x="472.4" y="276" width="47.6" height="22" rx="11" fill="none" stroke="#1a7f37" stroke-width="1"/><text x="496.2" y="291" font-size="12.5" font-weight="400" fill="#1a7f37" text-anchor="middle">code</text><rect x="28" y="312" width="504" height="62" rx="8" fill="#cf222e" fill-opacity="0.14" stroke="#cf222e" stroke-opacity="0.55"/><rect x="28" y="312" width="5" height="62" rx="2.5" fill="#cf222e"/><text x="46" y="337" font-size="16" font-weight="600" fill="#1f2328">Guardrails</text><text x="160" y="337" font-size="13" font-weight="400" fill="#59636e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">officehum.json · tool code</text><text x="46" y="360" font-size="14" font-weight="400" fill="#1f2328">Approvals, limits and refusals, checked in code</text><rect x="472.4" y="346" width="47.6" height="22" rx="11" fill="none" stroke="#cf222e" stroke-width="1"/><text x="496.2" y="361" font-size="12.5" font-weight="400" fill="#cf222e" text-anchor="middle">code</text><rect x="28" y="382" width="504" height="62" rx="8" fill="#8250df" fill-opacity="0.08" stroke="#8250df" stroke-opacity="0.55"/><rect x="28" y="382" width="5" height="62" rx="2.5" fill="#8250df"/><text x="46" y="407" font-size="16" font-weight="600" fill="#1f2328">Eval suite</text><text x="160" y="407" font-size="13" font-weight="400" fill="#59636e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">evals/*.json</text><text x="46" y="430" font-size="14" font-weight="400" fill="#1f2328">Scenarios with the calls and replies expected</text><rect x="435.4" y="416" width="84.60000000000001" height="22" rx="11" fill="none" stroke="#8250df" stroke-width="1"/><text x="477.7" y="431" font-size="12.5" font-weight="400" fill="#8250df" text-anchor="middle">test data</text><rect x="16" y="470" width="528" height="58" rx="10" fill="#1b7c83" fill-opacity="0.12" stroke="#1b7c83" stroke-opacity="0.55"/><text x="32" y="495" font-size="16" font-weight="600" fill="#1f2328">Pi Durable harness</text><text x="32" y="516" font-size="13.5" font-weight="400" fill="#59636e">Durable conversations, tool calls and approvals that survive a restart</text><rect x="16" y="540" width="528" height="40" rx="10" fill="none" stroke="#d1d9e0" stroke-width="1" stroke-dasharray="5 4"/><text x="280" y="565" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">Any model: hosted by default, or one on your own machine</text>
</svg>
