version: 2
updates:
  # Upstream Pi packages: one PR per new release, checked daily.
  # CI must pass (adapter contract tests, crash-recovery tests, agent evals) before merge.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: "@earendil-works/*"
    groups:
      pi-upstream:
        patterns:
          - "@earendil-works/*"
    labels:
      - pi-upstream
    commit-message:
      prefix: "deps(pi)"

  # Everything else: weekly, grouped.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@earendil-works/*"
    groups:
      other:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
