version: 2
updates:
  # Dependabot allows one entry per ecosystem and directory, so both npm groups live here.
  # Upstream Pi packages get their own PR per release; everything else is grouped into one.
  # CI must pass (adapter contract tests, crash-recovery tests, agent evals) before merge.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      pi-upstream:
        patterns:
          - "@earendil-works/*"
      other:
        patterns:
          - "*"
        exclude-patterns:
          - "@earendil-works/*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
