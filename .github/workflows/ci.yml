name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Engine-backed roles run their engine with python3 in tests (see docs/design/agent-package.md).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Paper document worker runs in its own Python 3.13 interpreter with hash-pinned libraries,
      # and takes that interpreter from OFFICEHUM_PAPER_PYTHON. Unset, its tests skip *visibly* — which
      # is how the whole Paper suite used to pass a green build without running a single test. Provision
      # it here so a green build means the suite ran; the script's three doctor sentinels fail the job if
      # the libraries are not the forks that own their module names.
      - uses: astral-sh/setup-uv@v5
      - name: Provision the Paper worker
        run: |
          packages/tools-paper-office/scripts/provision-worker.sh "$RUNNER_TEMP/paper-worker"
          echo "OFFICEHUM_PAPER_PYTHON=$RUNNER_TEMP/paper-worker/bin/python" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
